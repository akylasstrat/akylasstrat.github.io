title: "Akylas Stratigakos"
name: "Akylas Stratigakos"
email: "a.stratigakos@ucl.ac.uk"
description: "Akylas Stratigakos is a Lecturer at UCL developing AI, machine learning and optimization methods to rapidly improve operation and planning of low-carbon energy systems."

url: "https://akylasstrat.github.io"
baseurl: ""   # must match the repo name with a leading slash

collections:
  papers:
    output: true
    permalink: /papers/:name/

defaults:
  - scope:
      path: ""
      type: papers
    values:
      layout: paper

plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
